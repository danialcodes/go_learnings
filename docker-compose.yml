services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: danialcodes
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: danialcodes
    volumes:
      - pgdata:/var/lib/postgresql/data 
    ports:
      - "5433:5432"
    networks:
      - backend

  api:
    image: danialcodes/go_crud_api:latest
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      GIN_MODE: release
      DATABASE_URL: postgres://danialcodes:danialcodes@db:5432/postgres
    restart: always
    networks:
      - backend
 
volumes:
  pgdata:

networks:
  backend:
    driver: bridge